version: 2
project_id: cli-smoke
root_ontology: https://example.org/cli-smoke
interoperability:
  profile: https://hakjuoh.github.io/protege-mcp/profiles/project-v1/
  additional_profiles: []
  root_artifact: ontology.ttl
  metadata:
    path: ro-crate-metadata.json
    format: ro-crate-1.1
  canonicalization:
    algorithm: RDFC-1.0
    hash: SHA-256
    scope: root-ontology
    timeout_ms: 120000
external_terms:
  providers:
    - id: ebi-ols
      profile: ols4
      enabled: false
      origin_alias: ebi-ols
      ontologies: [efo]
      languages: [en]
      required_evidence_for: [reuse]
mappings:
  path: .protege-mcp/mappings.sssom.tsv
  allowed_predicates: [https://www.w3.org/2004/02/skos/core#exactMatch]
  allowed_sources: [ebi-ols]
  allowed_licenses: [CC-BY-4.0]
  require_license: true
  required_findings: [missing_source, missing_target]
jobs:
  allowed_types: [classification, project_qc, semantic_diff, inference_materialization]
  workers: 2
  queue_capacity: 32
  active_per_principal: 8
  retained_per_principal: 32
  retained_per_backend: 128
  retention_seconds: 3600
materialization:
  allowed_reasoners: [HermiT]
  allowed_categories: [subclass_axioms, equivalent_class_axioms]
  allowed_destinations: [new_ontology, project_file]
  allow_source_write: false
  max_axioms_per_category: 50000
  max_axioms_total: 50000
  max_bytes: 67108864
  timeout_ms: 120000
reasoning:
  reasoner: HermiT
  owl_profile: DL
validation:
  required_stages: [interoperability, reasoner, profile]
  fail_on: error
